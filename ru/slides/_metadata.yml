format:
  revealjs:
    theme: [black, ../../shared/styles/neutrinohit-reveal.scss]
    logo: ../../shared/reveal/dvnlogo.png
    width: 1600
    height: 900
    margin: 0.03
    css:
      - assets/01_definitions/transport-scenes.css
      - assets/01_definitions/observables.css
      - assets/01_definitions/math-labels.css
      - assets/01_definitions/sources-and-streaming.css
      - assets/02_diffusion/diffusion.css
    include-after-body:
      - text: |
          <script data-external="1" src="assets/01_definitions/math-helper.js" defer></script>
          <script data-external="1" src="assets/01_definitions/transport-scenes.js" defer></script>
          <script data-external="1" src="assets/01_definitions/observables.js" defer></script>
          <script data-external="1" src="assets/02_diffusion/diffusion.js" defer></script>
      - text: |
          <script data-external="1" data-context-home="https://neutrinohit.github.io/rte_lectures/" data-context-home-label="Страница курса" src="../../shared/reveal/neutrinohit-reveal-footer.js"></script>
      - ../../analytics/cloudflare-web-analytics.html
    html-math-method: mathjax
    embed-resources: false
    slide-number: true
    slide-level: 2
    toc: false
    transition: fade
    center: false
    incremental: false
    chalkboard: false
    preview-links: false
    code-copy: true
