project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - ru/slides/01_definitions.qmd
    - ru/slides/02_diffusion.qmd
    - ru/slides/03_isotropic_exact.qmd
    - ru/exercises/*.qmd
    - ru/practice/*.qmd
  resources:
    - /shared/styles/neutrinohit-reveal.scss
    - /shared/reveal/**
    - /analytics/**
    - /ru/slides/assets/01_definitions/**
    - /ru/slides/assets/02_diffusion/**
    - /ru/slides/assets/03_isotropic_exact/**
    - /ru/practice/assets/**/*.svg
    - /examples/*.py
    - /examples/requirements.txt
    - /shared/site/**

lang: ru-RU

website:
  title: "Распространение света в среде"
  site-url: "https://neutrinohit.github.io/rte_lectures/"
  navbar:
    left:
      - href: https://neutrinohit.github.io/
        text: NeutrinoHit
      - href: https://neutrinohit.github.io/ru/education.html#light-propagation
        text: Карта курса
      - href: index.qmd
        text: Курс
      - href: ru/exercises/index.qmd
        text: Задачи
      - href: ru/practice/index.qmd
        text: LightHit на практике
  page-footer:
    left: "© NeutrinoHit"
    right: "Распространение света в среде"

format:
  html:
    theme: cosmo
    css:
      - shared/site/neutrinohit-tokens.css
      - shared/site/neutrinohit-base.css
      - shared/site/neutrinohit-components.css
      - shared/site/neutrinohit-projects.css
      - styles.css
    toc: false
    page-layout: article
    include-after-body: analytics/cloudflare-web-analytics.html

execute:
  enabled: false
